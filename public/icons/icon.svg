<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a00"/>
      <stop offset="100%" style="stop-color:#0a0a0a"/>
    </linearGradient>
    <linearGradient id="clap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fb923c"/>
      <stop offset="100%" style="stop-color:#ea580c"/>
    </linearGradient>
    <linearGradient id="stripe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fdba74"/>
      <stop offset="100%" style="stop-color:#f97316"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Clapperboard body -->
  <rect x="76" y="210" width="360" height="220" rx="16" fill="url(#clap)" opacity="0.95"/>
  <!-- Clapperboard top bar -->
  <rect x="76" y="186" width="360" height="48" rx="8" fill="#fdba74"/>
  <!-- Top clapper (angled) -->
  <g transform="rotate(-18, 76, 186)">
    <rect x="76" y="144" width="360" height="44" rx="8" fill="url(#stripe)"/>
    <!-- Stripes on top clapper -->
    <rect x="120" y="144" width="28" height="44" fill="#1a0a00" opacity="0.7" rx="2"/>
    <rect x="186" y="144" width="28" height="44" fill="#1a0a00" opacity="0.7" rx="2"/>
    <rect x="252" y="144" width="28" height="44" fill="#1a0a00" opacity="0.7" rx="2"/>
    <rect x="318" y="144" width="28" height="44" fill="#1a0a00" opacity="0.7" rx="2"/>
    <rect x="384" y="144" width="28" height="44" fill="#1a0a00" opacity="0.7" rx="2"/>
  </g>
  <!-- Stripes on bottom clapper bar -->
  <rect x="120" y="186" width="28" height="48" fill="#1a0a00" opacity="0.5" rx="2"/>
  <rect x="186" y="186" width="28" height="48" fill="#1a0a00" opacity="0.5" rx="2"/>
  <rect x="252" y="186" width="28" height="48" fill="#1a0a00" opacity="0.5" rx="2"/>
  <rect x="318" y="186" width="28" height="48" fill="#1a0a00" opacity="0.5" rx="2"/>
  <rect x="384" y="186" width="28" height="48" fill="#1a0a00" opacity="0.5" rx="2"/>
  <!-- Text lines on body -->
  <rect x="108" y="262" width="200" height="10" rx="5" fill="#1a0a00" opacity="0.3"/>
  <rect x="108" y="290" width="280" height="10" rx="5" fill="#1a0a00" opacity="0.3"/>
  <rect x="108" y="318" width="160" height="10" rx="5" fill="#1a0a00" opacity="0.3"/>
  <!-- Play triangle accent -->
  <path d="M320 340 L380 375 L320 410 Z" fill="#1a0a00" opacity="0.2"/>
  <!-- Hinge circle -->
  <circle cx="96" cy="186" r="14" fill="#fdba74" stroke="#ea580c" stroke-width="3"/>
  <circle cx="96" cy="186" r="5" fill="#1a0a00" opacity="0.5"/>
</svg>
